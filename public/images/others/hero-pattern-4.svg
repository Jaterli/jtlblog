<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradientes principales para círculos -->
    <linearGradient id="grad-blue-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0072FF" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="grad-blue-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2E38" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1A508B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2D82B7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="grad-glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filtro de desenfoque suave -->
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
  </defs>

  <!-- Resplandor de fondo ambiental -->
  <circle cx="150" cy="120" r="160" fill="url(#grad-glow-cyan)" filter="url(#glow-blur)" />
  <circle cx="1050" cy="280" r="200" fill="url(#grad-blue-1)" filter="url(#glow-blur)" />
  <circle cx="600" cy="200" r="140" fill="url(#grad-blue-2)" filter="url(#glow-blur)" />

  <!-- Anillos y órbitas finas -->
  <circle cx="1000" cy="150" r="280" stroke="url(#grad-glow-cyan)" stroke-width="1.5" stroke-dasharray="8 6" fill="none" opacity="0.4" />
  <circle cx="1000" cy="150" r="220" stroke="#00C6FF" stroke-width="1" fill="none" opacity="0.25" />
  <circle cx="200" cy="300" r="240" stroke="url(#grad-blue-1)" stroke-width="2" stroke-dasharray="15 10" fill="none" opacity="0.3" />

  <!-- Círculos principales -->
  <circle cx="1050" cy="120" r="180" fill="url(#grad-blue-1)" />
  <circle cx="920" cy="220" r="110" fill="url(#grad-blue-2)" />
  <circle cx="150" cy="280" r="150" fill="url(#grad-blue-2)" />
  <circle cx="280" cy="200" r="80" fill="url(#grad-glow-cyan)" />
  <circle cx="550" cy="90" r="65" fill="url(#grad-blue-1)" opacity="0.6" />

  <!-- Orbes flotantes pequeños -->
  <circle cx="420" cy="260" r="18" fill="#00F2FE" opacity="0.7" />
  <circle cx="750" cy="140" r="24" fill="#0072FF" opacity="0.5" />
  <circle cx="820" cy="280" r="12" fill="#00C6FF" opacity="0.8" />
  <circle cx="120" cy="80" r="8" fill="#FFFFFF" opacity="0.6" />
  <circle cx="680" cy="320" r="10" fill="#4FACFE" opacity="0.7" />

  <!-- Detalle decorativo de puntos -->
  <g fill="#00F2FE" opacity="0.35">
    <circle cx="480" cy="180" r="2.5" />
    <circle cx="500" cy="180" r="2.5" />
    <circle cx="520" cy="180" r="2.5" />
    <circle cx="490" cy="200" r="2.5" />
    <circle cx="510" cy="200" r="2.5" />
    <circle cx="500" cy="220" r="2.5" />
  </g>
</svg>
