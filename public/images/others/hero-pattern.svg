<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradiente atenuado para el círculo inferior izquierdo -->
    <radialGradient id="grad-soft-left" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente más vivo para el círculo superior derecho -->
    <radialGradient id="grad-vivid-right" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0052D4" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#4364F7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6FB1FC" stop-opacity="0" />
    </radialGradient>

    <!-- Gradientes para los trazos centrales -->
    <linearGradient id="grad-ring-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4364F7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="grad-ring-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6FB1FC" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filtros de desenfoque -->
    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="strong-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Círculo atenuado inferior izquierdo -->
  <circle cx="150" cy="380" r="220" fill="url(#grad-soft-left)" filter="url(#soft-blur)" />

  <!-- Círculo superior derecho con más color -->
  <circle cx="1020" cy="40" r="280" fill="url(#grad-vivid-right)" filter="url(#strong-blur)" />

  <!-- Circunferencias centrales de gran diámetro -->
  <!-- Superior -->
  <circle cx="580" cy="140" r="320" stroke="url(#grad-ring-1)" stroke-width="2" fill="none" />
  
  <!-- Inferior (desplazada hacia abajo y punteada) -->
  <circle cx="620" cy="260" r="350" stroke="url(#grad-ring-2)" stroke-width="1.5" stroke-dasharray="12 8" fill="none" />

  <!-- Detalles de resplandor diminutos -->
  <circle cx="480" cy="190" r="3" fill="#00F2FE" opacity="0.6" />
  <circle cx="720" cy="210" r="4" fill="#4364F7" opacity="0.5" />
</svg>
