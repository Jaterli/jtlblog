name: Desplegar en GitHub Pages (temporal)

# Plan B por si Netlify no está disponible: solo se lanza a mano (Actions → Run workflow).
# Para reactivarlo en cada push, añade de nuevo este disparador:
#   workflow_run:
#     workflows: ["Actualizar conteo de publicaciones por mes"]
#     types: [completed]
# y apunta los DNS de jaterli.com a GitHub Pages (185.199.108-111.153).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_DEPLOY_TARGET: github
      # Opcionales: si se definen como secrets, la home mostrará los Dev Tips guardados en Netlify Blobs
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_BLOBS_TOKEN: ${{ secrets.NETLIFY_BLOBS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Dominio personalizado
        run: echo "jaterli.com" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

